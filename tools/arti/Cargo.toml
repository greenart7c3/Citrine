[package]
name = "citrine-arti"
version = "2.7.0"
edition = "2021"
publish = false

# JNI wrapper around Arti (Tor in Rust) for Citrine's built-in Tor.
# Adapted from Amber's tools/arti (which adapted Amethyst's tools/arti-build).
# Citrine additionally runs an onion service (the relay's .onion address),
# so the JNI surface extends Amber's with startOnionService/getOnionHostname/
# stopOnionService.
[lib]
name = "citrine_arti"
crate-type = ["cdylib"]

[workspace]

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "onion-service-client",
    # Running the relay's onion service (TorClient::launch_onion_service).
    "onion-service-service",
    # TorClient::keymgr(), used to read the .onion address of the service.
    "onion-service-cli-extra",
    "static-sqlite",
] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
# Direct dep on rustls so we can install the `ring` crypto provider ourselves:
# since arti-v2.3.0 tor-rtcompat no longer installs one implicitly, and `ring`
# avoids the cross-compilation pain of aws-lc-rs (Arti's default).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Onion service identity key and .onion address types.
tor-hscrypto = { version = "=0.47.0", default-features = false }
# Onion service launch and rendezvous handling (TorClient::launch_onion_service).
tor-hsservice = { version = "=0.47.0", default-features = false }
# Reading the persisted HsIdKeypair through the client's keystore.
tor-keymgr = { version = "=0.47.0", default-features = false, features = ["keymgr"] }
# Permissions check on the legacy kmp-tor hidden service directory.
fs-mistrust = "0.16"
# IncomingStreamRequest::Begin port check for onion service streams.
tor-proto = { version = "=0.47.0", default-features = false }
# Cell messages for accepting/rejecting onion service streams.
tor-cell = { version = "=0.47.0", default-features = false }
# DisplayRedacted on HsId: the only way to print the .onion address.
safelog = "0.10"
# Iterating the StreamRequest stream produced by handle_rend_requests.
futures = { version = "0.3", default-features = false, features = ["std"] }
jni = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# saturating-time 0.5.0 (the latest, used by tor-netdoc) loops forever on
# Windows, where SystemTime has 100ns resolution: see the "Amber patch" comment
# in patches/saturating-time/src/internal.rs. Drop this once upstream fixes it.
[patch.crates-io]
saturating-time = { path = "patches/saturating-time" }
